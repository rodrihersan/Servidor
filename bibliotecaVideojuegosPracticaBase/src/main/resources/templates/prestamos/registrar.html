<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8"/>
        <title>Registrar préstamo</title>
        <link rel="stylesheet" type="text/css" th:href="@{/css/index.css}"/>
        <link rel="stylesheet" type="text/css" th:href="@{/css/formularios.css}"/>
        <link rel="stylesheet" type="text/css" th:href="@{/css/tablas.css}"/>
    </head>
    <body>
        <div th:replace="~{fragmentos/menu :: menu}"></div>
        <h1>Registrar préstamo</h1>
        <div class="container">
            <div class="form">
                <form th:action="@{/prestamos/registrar}" method="post">
                    <label for="idSocio">Socio</label>
                    <select id="idSocio" name="idSocio">
                        <option th:each="s : ${desplegableSocios}" th:value="${s.id}" th:text="${s.nombre + ' ' + s.apellidos}"></option>
                    </select>

                    <label for="idCopia">Copia</label>
                    <select id="idCopia" name="idCopia">
                        <option th:each="c : ${desplegableCopias}" th:value="${c.id}"
                                th:text="${c.titulo + ' (' + c.plataforma + ') - ' + c.codigoInventario}"></option>
                    </select>

                    <input type="submit" value="Registrar préstamo"/>
                </form>
            </div>
        </div>
        <div th:replace="~{fragmentos/mensajes :: mensajes}"></div>

        <div class="resumen" th:if="${prestamoCreado != null}">
            <h2>Préstamo registrado</h2>
            <p><strong th:text="${prestamoCreado.titulo}"></strong> (<span th:text="${prestamoCreado.plataforma}"></span>, copia <span th:text="${prestamoCreado.codigoInventario}"></span>)</p>
            <p>Socio: <span th:text="${prestamoCreado.socio}"></span></p>
            <p>Préstamo: <span th:text="${prestamoCreado.fechaPrestamo}"></span> · Fecha límite: <span th:text="${prestamoCreado.fechaLimite}"></span></p>
        </div>

    </body>
</html>
