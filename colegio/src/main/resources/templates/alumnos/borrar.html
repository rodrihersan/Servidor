<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/formularios.css}">
    <link rel="stylesheet" th:href="@{/css/tablas.css}">
    <meta charset="UTF-8">
    <title>Borrar Alumnos</title>
</head>
<body>
<div th:replace="~{fragmentos/menu :: menu}"></div>
<h1>Borrar alumnos</h1>
<div class="container">
    <div class="form">
        <form th:action="@{/alumnos/formularioBorrarAlumnos}"
              method="post" id="formulario">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre"><br>
            <label for="apellido">Apellidos</label>
            <input type="text" id="apellido" name="apellido">
            <br>
            <label for="familiaNumerosa">Familia
                numerosa</label>
            <input type="checkbox" id="familiaNumerosa"
                   name="familiaNumerosa"><br>
            <label for="activo">Activo</label>
            <input type="checkbox" id="activo" name="activo"
                   checked><br>
            <input type="submit" value="Buscar">
        </form>
    </div>
</div>
<h2 th:if="${listaAlumnos == null or
listaAlumnos.isEmpty()}">No hay alumnos que cumplan esos criterios</h2>
<table th:if="${listaAlumnos != null and
!listaAlumnos.isEmpty()}">
    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Apellidos</th>
        <th>Municipio</th>
        <th></th>
    </tr>
    <tr th:each="alumno : ${listaAlumnos}">
        <td th:text="${alumno.id}"></td>
        <td th:text="${alumno.nombre}"></td>
        <td th:text="${alumno.apellido}"></td>
        <td th:text="${alumno.municipio}"></td>
        <td>
            <form
                    th:action="@{/alumnos/{id}/eliminar(id=${alumno.id})}" method="post">
                <input type="submit" value="Borrar">
            </form>
        </td>
    </tr>
</table>
<p th:if="${resultado != null and resultado}">Alumno borrado
    correctamente.</p>
<p th:if="${resultado != null and !resultado}">No se ha podido
    borrar el alumno.</p>
</body>
</html>
