<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" type="text/css" th:href="@{/css/index.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/formularios.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/tablas.css}">
    <meta charset="UTF-8">
    <title>Listado de Videojuegos</title>
</head>
<body>
<div th:replace="~{fragmentos/menu :: menu}"></div>
<h1>Listado de videojuegos</h1>
<div class="container">
    <div class="form">
        <form th:action="@{/videojuegos/listadoVideojuegos}" method="post">
            <label for="titulo">Título</label>
            <input type="text" id="titulo" name="titulo">
            <label for="idDesarrolladora">Desarrolladora</label>
            <select id="idDesarrolladora" name="idDesarrolladora">
                <option value="">Todas</option>
                <option th:each="desarrolladora : ${desplegableDesarrolladoras}"
                        th:value="${desarrolladora.id}"
                        th:text="${desarrolladora.descripcion}"></option>
            </select>
            <label for="anioDesde">Año desde</label>
            <input type="number" id="anioDesde" name="anioDesde">
            <label for="pegiMaximo">PEGI máximo</label>
            <select id="pegiMaximo" name="pegiMaximo">
                <option value="">Cualquiera</option>
                <option value="3">3</option>
                <option value="7">7</option>
                <option value="12">12</option>
                <option value="16">16</option>
                <option value="18">18</option>
            </select>
            <label for="soloDisponibles">Solo con copias disponibles</label>
            <input type="checkbox" id="soloDisponibles" name="soloDisponibles" value="true">
            <input type="submit" value="Buscar">
        </form>
    </div>
</div>
<h2 th:if="${listaVideojuegos == null or listaVideojuegos.isEmpty()}">No hay videojuegos que cumplan esos criterios</h2>
<table th:if="${listaVideojuegos != null and !listaVideojuegos.isEmpty()}">
    <tr>
        <th>ID</th>
        <th>Título</th>
        <th>Desarrolladora</th>
        <th>Año</th>
        <th>PEGI</th>
        <th>Copias</th>
        <th>Disponibles</th>
    </tr>
    <tr th:each="videojuego : ${listaVideojuegos}">
        <td th:text="${videojuego.id}"></td>
        <td th:text="${videojuego.titulo}"></td>
        <td th:text="${videojuego.desarrolladora}"></td>
        <td th:text="${videojuego.anioLanzamiento}"></td>
        <td th:text="${videojuego.pegi}"></td>
        <td th:text="${videojuego.copiasTotales}"></td>
        <td th:text="${videojuego.copiasDisponibles}"></td>
    </tr>
</table>
</body>
</html>
