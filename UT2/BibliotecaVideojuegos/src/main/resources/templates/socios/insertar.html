
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/formularios.css}">
    <meta charset="UTF-8">
    <title>Insertar socio</title>
</head>
<body>

<div th:replace="~{fragmentos/menu :: menu}"></div>

<header>
    <h1>Insertar socio</h1>
</header>

<div th:replace="~{fragmentos/mensajes :: mensajes}"></div>

<div class="container">
    <div class="form">

        <form th:action="@{/socios/insertar}" method="post" id="formulario">

            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre"
                   th:value="${nombre}" required>

            <label for="apellidos">Apellidos</label>
            <input type="text" id="apellidos" name="apellidos"
                   th:value="${apellidos}" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email"
                   th:value="${email}" required>

            <label for="fechaNacimiento">Fecha de nacimiento</label>
            <input type="date" id="fechaNacimiento" name="fechaNacimiento"
                   th:value="${fechaNacimiento}" required>

            <br>
            <input type="submit" value="Registrar socio">

        </form>

    </div>
</div>

</body>
</html>
