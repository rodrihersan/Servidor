<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8"/>
        <title>Borrar socios</title>
        <link rel="stylesheet" type="text/css" th:href="@{/css/index.css}"/>
        <link rel="stylesheet" type="text/css" th:href="@{/css/formularios.css}"/>
        <link rel="stylesheet" type="text/css" th:href="@{/css/tablas.css}"/>
    </head>
    <body>
        <div th:replace="~{fragmentos/menu :: menu}"></div>
        <h1>Borrar socios</h1>
        <div th:replace="~{fragmentos/filtros :: filtroSocios('/socios/borrar')}"></div>
        <div th:replace="~{fragmentos/mensajes :: mensajes}"></div>

        <h2 th:if="${listaSocios.isEmpty()}">No hay socios que cumplan esos criterios</h2>
        <table th:if="${!listaSocios.isEmpty()}">
            <tr>
                <th>ID</th><th>Nombre</th><th>Apellidos</th><th>Email</th><th>Edad</th><th>Activo</th><th>Préstamos abiertos</th><th>Alta</th><th>Borrar</th>
            </tr>
            <tr th:each="s : ${listaSocios}">
                <td th:text="${s.id}"></td>
                <td th:text="${s.nombre}"></td>
                <td th:text="${s.apellidos}"></td>
                <td th:text="${s.email}"></td>
                <td th:text="${s.edad}"></td>
                <td th:text="${s.activo} ? 'Sí' : 'No'"></td>
                <td th:text="${s.prestamosAbiertos}"></td>
                <td th:text="${s.fechaAlta}"></td>
                <td>
                    <form th:action="@{/socios/eliminar}" method="post">
                        <input type="hidden" name="id" th:value="${s.id}"/>
                        <input type="submit" value="Borrar" onclick="return confirm('¿Seguro que quieres borrar este socio?')"/>
                    </form>
                </td>
            </tr>
        </table>

    </body>
</html>
