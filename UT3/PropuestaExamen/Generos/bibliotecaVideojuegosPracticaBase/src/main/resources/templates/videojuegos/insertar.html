<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8"/>
        <title>Insertar videojuego</title>
        <link rel="stylesheet" type="text/css" th:href="@{/css/index.css}"/>
        <link rel="stylesheet" type="text/css" th:href="@{/css/formularios.css}"/>
        <link rel="stylesheet" type="text/css" th:href="@{/css/tablas.css}"/>
    </head>
    <body>
        <div th:replace="~{fragmentos/menu :: menu}"></div>
        <h1>Insertar videojuego</h1>
        <div class="container">
            <div class="form">
                <form th:action="@{/videojuegos/insertar}" method="post">
                    <label for="titulo">Título</label>
                    <input type="text" id="titulo" name="titulo"/>

                    <label for="anioLanzamiento">Año de lanzamiento</label>
                    <input type="number" id="anioLanzamiento" name="anioLanzamiento"/>

                    <label for="pegi">PEGI</label>
                    <select id="pegi" name="pegi">
                        <option th:each="p : ${pegis}" th:value="${p}" th:text="${p}"></option>
                    </select>

                    <label for="idDesarrolladora">Desarrolladora</label>
                    <select id="idDesarrolladora" name="idDesarrolladora">
                        <option th:each="d : ${desplegableDesarrolladoras}" th:value="${d.id}" th:text="${d.nombre}"></option>
                    </select>

                    <input type="submit" value="Insertar"/>
                </form>
            </div>
        </div>
        <div th:replace="~{fragmentos/mensajes :: mensajes}"></div>

    </body>
</html>
