<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8"/>
        <title>Insertar socio</title>
        <link rel="stylesheet" type="text/css" th:href="@{/css/index.css}"/>
        <link rel="stylesheet" type="text/css" th:href="@{/css/formularios.css}"/>
        <link rel="stylesheet" type="text/css" th:href="@{/css/tablas.css}"/>
    </head>
    <body>
        <div th:replace="~{fragmentos/menu :: menu}"></div>
        <h1>Insertar socio</h1>
        <div class="container">
            <div class="form">
                <form th:action="@{/socios/insertar}" method="post">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre"/>

                    <label for="apellidos">Apellidos</label>
                    <input type="text" id="apellidos" name="apellidos"/>

                    <label for="email">Email</label>
                    <input type="text" id="email" name="email"/>

                    <label for="fechaNacimiento">Fecha de nacimiento</label>
                    <input type="date" id="fechaNacimiento" name="fechaNacimiento"/>

                    <input type="submit" value="Insertar"/>
                </form>
            </div>
        </div>
        <div th:replace="~{fragmentos/mensajes :: mensajes}"></div>

    </body>
</html>
