<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/formularios.css}">
    <link rel="stylesheet" th:href="@{/css/tablas.css}">
    <meta charset="UTF-8">
    <title>Listado de préstamos</title>
</head>
<body>
<div th:replace="~{fragmentos/menu :: menu}"></div>
<h1>Listado de préstamos</h1>

<div class="container">
    <div class="form">
        <form th:action="@{/prestamos/listado}" method="post">
            <label for="socio">Socio</label>
            <input type="text" id="socio" name="socio">
            <label for="videojuego">Videojuego</label>
            <input type="text" id="videojuego" name="videojuego">
            <label for="estado">Estado</label>
            <select id="estado" name="estado">
                <option value="">Todos</option>
                <option value="EN PLAZO">En plazo</option>
                <option value="VENCIDO">Vencidos</option>
                <option value="DEVUELTO">Devueltos</option>
            </select>
            <input type="submit" value="Buscar">
        </form>
    </div>
</div>

<h2 th:if="${prestamos == null or prestamos.isEmpty()}">No hay préstamos que cumplan esos criterios</h2>

<table th:if="${prestamos != null and !prestamos.isEmpty()}">
    <tr>
        <th>ID</th>
        <th>Socio</th>
        <th>Videojuego</th>
        <th>Copia</th>
        <th>Préstamo</th>
        <th>Límite</th>
        <th>Devolución</th>
        <th>Multa</th>
        <th>Estado</th>
        <th>Retraso (días)</th>
    </tr>
    <tr th:each="prestamo : ${prestamos}">
        <td th:text="${prestamo.id}"></td>
        <td th:text="${prestamo.socio}"></td>
        <td th:text="${prestamo.videojuego}"></td>
        <td th:text="${prestamo.codigoInventario}"></td>
        <td th:text="${prestamo.fechaPrestamo}"></td>
        <td th:text="${prestamo.fechaLimite}"></td>
        <td th:text="${prestamo.fechaDevolucion != null ? prestamo.fechaDevolucion : '—'}"></td>
        <td th:text="${#numbers.formatDecimal(prestamo.multa, 1, 2) + ' €'}"></td>
        <td><span class="estado"
                  th:classappend="${'estado-' + prestamo.estado.replace(' ', '_')}"
                  th:text="${prestamo.estado}"></span></td>
        <td th:text="${prestamo.diasRetraso}"></td>
    </tr>
</table>
</body>
</html>
