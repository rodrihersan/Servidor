<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" type="text/css" th:href="@{/css/index.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/formularios.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/tablas.css}">
    <meta charset="UTF-8">
    <title>Listado de Socios</title>
</head>
<body>
<div th:replace="~{fragmentos/menu :: menu}"></div>
<h1>Listado de socios</h1>
<div class="container">
    <div class="form">
        <form th:action="@{/socios/listado}" method="post">
            <label for="nombre">Nombre o apellidos</label>
            <input type="text" id="nombre" name="nombre">
            <label for="email">Email</label>
            <input type="text" id="email" name="email">
            <label for="activo">Estado</label>
            <select id="activo" name="activo">
                <option value="">Todos</option>
                <option value="true">Activos</option>
                <option value="false">Inactivos</option>
            </select>
            <input type="submit" value="Buscar">
        </form>
    </div>
</div>

<h2 th:if="${listaSocios == null or listaSocios.isEmpty()}">No hay socios que cumplan esos criterios</h2>
<table th:if="${listaSocios != null and !listaSocios.isEmpty()}">
    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Apellidos</th>
        <th>Email</th>
        <th>Fecha de nacimiento</th>
        <th>Edad</th>
        <th>Estado</th>
        <th>Préstamos abiertos</th>
        <th>Fecha de alta</th>
    </tr>

    <tr th:each="socio : ${listaSocios}">
        <td th:text="${socio.id}"></td>
        <td th:text="${socio.nombre}"></td>
        <td th:text="${socio.apellidos}"></td>
        <td th:text="${socio.email}"></td>
        <td th:text="${socio.fechaNacimiento}"></td>
        <td th:text="${socio.edad}"></td>
        <td th:text="${socio.activo ? 'Activo' : 'Inactivo'}"></td>
        <td th:text="${socio.prestamosAbiertos}"></td>
        <td th:text="${socio.fechaAlta}"></td>
    </tr>
</table>
</body>
</html>
