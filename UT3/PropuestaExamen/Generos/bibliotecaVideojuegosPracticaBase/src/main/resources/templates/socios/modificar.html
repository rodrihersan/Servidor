<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8"/>
        <title>Modificar socios</title>
        <link rel="stylesheet" type="text/css" th:href="@{/css/index.css}"/>
        <link rel="stylesheet" type="text/css" th:href="@{/css/formularios.css}"/>
        <link rel="stylesheet" type="text/css" th:href="@{/css/tablas.css}"/>
    </head>
    <body>
        <div th:replace="~{fragmentos/menu :: menu}"></div>
        <h1>Modificar socios</h1>
        <div th:replace="~{fragmentos/filtros :: filtroSocios('/socios/modificar')}"></div>
        <div th:replace="~{fragmentos/mensajes :: mensajes}"></div>

        <h2 th:if="${listaSocios.isEmpty()}">No hay socios que cumplan esos criterios</h2>
        <div class="registros">
            <form class="registro" th:each="s : ${listaSocios}" th:action="@{/socios/actualizar}" method="post">
                <input type="hidden" name="id" th:value="${s.id}"/>
                <span class="id" th:text="'#' + ${s.id}"></span>
                <input type="text" name="nombre" th:value="${s.nombre}"/>
                <input type="text" name="apellidos" th:value="${s.apellidos}"/>
                <input type="text" name="email" th:value="${s.email}"/>
                <input type="date" name="fechaNacimiento" th:value="${s.fechaNacimiento}"/>
                <label>Activo <input type="checkbox" name="activo" th:checked="${s.activo}"/></label>
                <input type="submit" value="Modificar"/>
            </form>
        </div>

    </body>
</html>
