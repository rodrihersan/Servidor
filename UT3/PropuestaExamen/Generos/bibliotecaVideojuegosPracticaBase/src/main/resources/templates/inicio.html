<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8"/>
        <title>GameVault · Biblioteca de videojuegos</title>
        <link rel="stylesheet" type="text/css" th:href="@{/css/index.css}"/>
    </head>
    <body>
        <div th:replace="~{fragmentos/menu :: menu}"></div>
        <h1>GameVault · Biblioteca de videojuegos</h1>

        <div class="contadores">
            <div class="contador"><span th:text="${resumen.videojuegos}">0</span><small>Videojuegos</small></div>
            <div class="contador"><span th:text="${resumen.sociosActivos}">0</span><small>Socios activos</small></div>
            <div class="contador"><span th:text="${resumen.prestamosAbiertos}">0</span><small>Préstamos abiertos</small></div>
            <div class="contador vencidos"><span th:text="${resumen.prestamosVencidos}">0</span><small>Préstamos vencidos</small></div>
        </div>


    </body>
</html>
