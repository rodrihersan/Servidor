<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/formularios.css}">
    <link rel="stylesheet" th:href="@{/css/tablas.css}">
    <meta charset="UTF-8">
    <title>Devolver préstamo</title>
</head>
<body>
<div th:replace="~{fragmentos/menu :: menu}"></div>
<h1>Devolver préstamo</h1>

<div th:replace="~{fragmentos/mensajes :: mensajes}"></div>

<h2 th:if="${prestamos == null or prestamos.isEmpty()}">No hay préstamos abiertos</h2>

<table th:if="${prestamos != null and !prestamos.isEmpty()}">
    <tr>
        <th>ID</th>
        <th>Socio</th>
        <th>Videojuego</th>
        <th>Límite</th>
        <th>Estado</th>
        <th>Devolver</th>
    </tr>
    <tr th:each="prestamo : ${prestamos}">
        <td th:text="${prestamo.id}"></td>
        <td th:text="${prestamo.socio}"></td>
        <td th:text="${prestamo.videojuego + ' - ' + prestamo.codigoInventario}"></td>
        <td th:text="${prestamo.fechaLimite}"></td>
        <td><span class="estado"
                  th:classappend="${'estado-' + prestamo.estado.replace(' ', '_')}"
                  th:text="${prestamo.estado}"></span></td>
        <td>
            <form th:action="@{/prestamos/devolver}" method="post">
                <input type="hidden" name="idPrestamo" th:value="${prestamo.id}">
                <label>Copia dañada <input type="checkbox" name="danada" value="true"></label>
                <input type="submit" value="Devolver">
            </form>
        </td>
    </tr>
</table>
</body>
</html>
