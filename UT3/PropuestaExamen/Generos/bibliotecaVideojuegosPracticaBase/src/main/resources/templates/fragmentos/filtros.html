<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <body>
        <div th:fragment="filtroVideojuegos(accion)" class="container">
            <div class="form">
                <form th:action="@{${accion}}" method="post">
                    <label for="titulo">Título</label>
                    <input type="text" id="titulo" name="titulo"/>

                    <label for="idDesarrolladora">Desarrolladora</label>
                    <select id="idDesarrolladora" name="idDesarrolladora">
                        <option value="">Todas</option>
                        <option th:each="d : ${desplegableDesarrolladoras}" th:value="${d.id}" th:text="${d.nombre}"></option>
                    </select>

                    <label for="anioDesde">Año desde</label>
                    <input type="number" id="anioDesde" name="anioDesde"/>

                    <label for="pegiMax">PEGI máximo</label>
                    <select id="pegiMax" name="pegiMax">
                        <option value="">Cualquiera</option>
                        <option th:each="p : ${pegis}" th:value="${p}" th:text="${p}"></option>
                    </select>

                    <label for="soloDisponibles">Solo con copias disponibles</label>
                    <input type="checkbox" id="soloDisponibles" name="soloDisponibles"/>

                    <input type="submit" value="Buscar"/>
                </form>
            </div>
        </div>

        <div th:fragment="filtroSocios(accion)" class="container">
            <div class="form">
                <form th:action="@{${accion}}" method="post">
                    <label for="nombre">Nombre o apellidos</label>
                    <input type="text" id="nombre" name="nombre"/>

                    <label for="email">Email</label>
                    <input type="text" id="email" name="email"/>

                    <label for="activo">Activo</label>
                    <select id="activo" name="activo">
                        <option value="">Todos</option>
                        <option value="true">Sí</option>
                        <option value="false">No</option>
                    </select>

                    <input type="submit" value="Buscar"/>
                </form>
            </div>
        </div>
    </body>
</html>
