<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8"/>
        <title>Modificar videojuegos</title>
        <link rel="stylesheet" type="text/css" th:href="@{/css/index.css}"/>
        <link rel="stylesheet" type="text/css" th:href="@{/css/formularios.css}"/>
        <link rel="stylesheet" type="text/css" th:href="@{/css/tablas.css}"/>
    </head>
    <body>
        <div th:replace="~{fragmentos/menu :: menu}"></div>
        <h1>Modificar videojuegos</h1>
        <div th:replace="~{fragmentos/filtros :: filtroVideojuegos('/videojuegos/modificar')}"></div>
        <div th:replace="~{fragmentos/mensajes :: mensajes}"></div>

        <h2 th:if="${listaVideojuegos.isEmpty()}">No hay videojuegos que cumplan esos criterios</h2>
        <div class="registros">
            <form class="registro" th:each="v : ${listaVideojuegos}" th:action="@{/videojuegos/actualizar}" method="post">
                <input type="hidden" name="id" th:value="${v.id}"/>
                <span class="id" th:text="'#' + ${v.id}"></span>
                <input type="text" name="titulo" th:value="${v.titulo}"/>
                <input type="number" name="anioLanzamiento" th:value="${v.añoLanzamiento}"/>
                <select name="pegi">
                    <option th:each="p : ${pegis}" th:value="${p}" th:text="${p}" th:selected="${p == v.pegi}"></option>
                </select>
                <select name="idDesarrolladora">
                    <option th:each="d : ${desplegableDesarrolladoras}" th:value="${d.id}" th:text="${d.nombre}"
                            th:selected="${d.id == v.idDesarrolladora}"></option>
                </select>
                <input type="submit" value="Modificar"/>
            </form>
        </div>

    </body>
</html>
