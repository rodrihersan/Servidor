<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Listado de préstamos</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/index.css}"/>
    <link rel="stylesheet" type="text/css" th:href="@{/css/formularios.css}"/>
    <link rel="stylesheet" type="text/css" th:href="@{/css/tablas.css}"/>
</head>
<body>
<div th:replace="~{fragmentos/menu :: menu}"></div>
<h1>Listado de préstamos</h1>
<div class="container">
    <div class="form">
        <form th:action="@{/prestamos/listado}" method="post">
            <label for="socio">Socio</label>
            <input type="text" id="socio" name="socio"/>

            <label for="titulo">Videojuego</label>
            <input type="text" id="titulo" name="titulo"/>

            <label for="estado">Estado</label>
            <select id="estado" name="estado">
                <option value="">Todos</option>
                <option th:each="e : ${estados}" th:value="${e}" th:text="${e}"></option>
            </select>

            <label for="desde">Desde</label>
            <input type="date" id="desde" name="desde"/>

            <input type="submit" value="Buscar"/>
        </form>
    </div>
</div>
<div th:replace="~{fragmentos/mensajes :: mensajes}"></div>

<h2 th:if="${listaPrestamos.isEmpty()}">No hay préstamos que cumplan esos criterios</h2>
<table th:if="${!listaPrestamos.isEmpty()}">
    <tr>
        <th>ID</th>
        <th>Socio</th>
        <th>Videojuego</th>
        <th>Plataforma</th>
        <th>Préstamo</th>
        <th>Límite</th>
        <th>Devolución</th>
        <th>Multa</th>
        <th>Estado</th>
        <th>Retraso (días)</th>
        <th>Renovar</th>
    </tr>
    <tr th:each="p : ${listaPrestamos}">
        <td th:text="${p.id}"></td>
        <td th:text="${p.socio}"></td>
        <td th:text="${p.titulo}"></td>
        <td th:text="${p.plataforma}"></td>
        <td th:text="${p.fechaPrestamo}"></td>
        <td th:text="${p.fechaLimite}"></td>
        <td th:text="${p.fechaDevolucion} ?: '—'"></td>
        <td th:text="${#numbers.formatDecimal(p.multa, 1, 2)} + ' €'"></td>
        <td><span th:class="${'estado estado-' + p.estado}" th:text="${p.estado}"></span></td>
        <td th:text="${p.diasRetraso}"></td>
        <td>
            <form th:if="${p.fechaDevolucion == null}" th:action="@{/prestamos/renovar}" method="post">
                <input type="hidden" name="idPrestamo" th:value="${p.id}">
                <input type="submit" value="Renovar">
            </form>
        </td>
    </tr>
</table>

</body>
</html>
