<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Listado de préstamos</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/index.css}"/>
    <link rel="stylesheet" type="text/css" th:href="@{/css/formularios.css}"/>
    <link rel="stylesheet" type="text/css" th:href="@{/css/tablas.css}"/>
</head>
<body>
<div th:replace="~{fragmentos/menu :: menu}"></div>
<h1>Videojuegos más prestados</h1>
<table>
    <thead>
    <tr><th>#</th><th>Título</th><th>Préstamos</th></tr>
    </thead>
    <tbody>
    <tr th:each="juego, fila : ${listaVideojuegos}">
        <td th:text="${fila.count}"></td>
        <td th:text="${juego.titulo}"></td>
        <td th:text="${juego.totalPrestado}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
